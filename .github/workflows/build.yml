name: Build

on:
  push:
    branches:
      - main
    # Docs, tooling and the one-off codec workflow don't affect the app.
    paths-ignore:
      - "docs/**"
      - "tool/**"
      - "**/*.md"
      - ".github/workflows/vox-codec-samples.yml"
      - ".github/workflows/vox-mimi-export.yml"
      - ".github/workflows/vox-mimi-release.yml"
      - ".github/workflows/vox-image-compare.yml"
      - ".github/workflows/vox-fetch-compressai.yml"
      - ".github/workflows/vox-fetch-aom.yml"
  workflow_dispatch:

# MeshCore Open TAK builds Android only. A newer push cancels an older,
# still-running build so minutes aren't spent on superseded commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20 # recent commits for the release notes
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache libaom (Android)
        id: aomcache
        uses: actions/cache@v4
        with:
          path: third_party/aom-android
          key: aom-android-v3.12.1-arm64-1
      - name: Build libaom for Android
        if: steps.aomcache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/aom.tgz "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/deps-cache/aom-v3.12.1.tar.gz"
          echo "76558ad5918820d66fa78460d9957e5bbf7cf9eef1a5421b5ba5e616f200d76e  /tmp/aom.tgz" | sha256sum -c
          tar xzf /tmp/aom.tgz -C /tmp
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          echo "Using NDK: $NDK"
          cmake -S /tmp/aom -B /tmp/aom-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTS=0 -DENABLE_TESTDATA=0 \
            -DENABLE_TOOLS=0 -DCONFIG_AV1_HIGHBITDEPTH=0 -DCONFIG_WEBM_IO=0
          cmake --build /tmp/aom-build -j"$(nproc)" --target aom
          OUT=third_party/aom-android/arm64-v8a
          mkdir -p "$OUT/lib" "$OUT/include/aom"
          cp /tmp/aom-build/libaom.a "$OUT/lib/"
          cp /tmp/aom/aom/*.h "$OUT/include/aom/"
          ls -la "$OUT/lib"
      - run: flutter pub get
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-meshcore-open-tak}" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Signing with the permanent release key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key and will not install over an earlier build"
          fi
      # Build number always increases, so every APK installs as an update.
      - run: flutter build apk --release --no-pub --target-platform android-arm64 --build-number=$((1000 + GITHUB_RUN_NUMBER))
      - name: Check VOX native libraries and models are in the APK
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk > /tmp/apk.txt
          for f in lib/arm64-v8a/libvox_av1.so lib/arm64-v8a/libcodec2.so \
                   assets/flutter_assets/assets/vox/face_yunet_2023mar.onnx \
                   assets/flutter_assets/assets/vox/text_ppocrv3_det.onnx; do
            grep -q "$f" /tmp/apk.txt || { echo "missing from APK: $f"; exit 1; }
          done
          grep -E "libvox_av1|libcodec2|assets/vox" /tmp/apk.txt
          ls -la build/app/outputs/flutter-apk/app-release.apk
          echo "Largest entries:"
          sort -k1 -n -r /tmp/apk.txt | head -15
      - name: Publish APK contents report
        if: always()
        run: |
          mkdir -p /tmp/apkrep && cd /tmp/apkrep
          ls -la "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/" > apk-size.txt 2>&1 || true
          unzip -lv "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk" > apk-contents.txt 2>&1 || true
          sort -k1 -n -r apk-contents.txt | head -40 > apk-largest.txt || true
          echo "${GITHUB_SHA}" > commit.txt
          git init -q -b apk-report
          git config user.name tak-ci
          git config user.email tak-ci@users.noreply.github.com
          git add -A
          git commit -qm "APK report for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-report
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-tak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish to the "Latest build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-release.apk meshcore-open-tak.apk
          build=$((1000 + GITHUB_RUN_NUMBER))
          signed="debug key (uninstall the old app before installing)"
          [ -f android/key.properties ] && signed="permanent release key (installs over the previous build)"
          {
            echo "**Build $build** · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo
            echo "Signed with the $signed."
            echo
            echo "Download **meshcore-open-tak.apk** below and open it on your phone."
            echo
            echo "Recent changes:"
            git log -8 --no-merges --pretty='- %s' 2>/dev/null || true
          } > notes.md
          # Move the tag to this commit, then create or update the release.
          git tag -f latest-build "$GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/latest-build
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "Latest build ($build)" --notes-file notes.md --latest
          else
            gh release create latest-build --title "Latest build ($build)" --notes-file notes.md --latest
          fi
          gh release upload latest-build meshcore-open-tak.apk --clobber
