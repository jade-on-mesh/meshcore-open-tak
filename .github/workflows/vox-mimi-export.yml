name: VOX Mimi ONNX export

# Feasibility spike for Mimi voice: export to ONNX, quantize, check parity
# and CPU speed. Manual only. Report + WAVs go to the `mimi-export` branch;
# the ONNX files are kept as a 14-day workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (CPU-only PyTorch)
        timeout-minutes: 10
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install "transformers>=4.45" onnx onnxruntime soundfile numpy
      - name: Export, quantize, verify
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/out
          python tool/vox/mimi_export.py /tmp/out 2>&1 | tee /tmp/out/export.log
          exit ${PIPESTATUS[0]}
      - name: Keep ONNX files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimi-onnx
          path: /tmp/out/*.onnx
          retention-days: 14
      - name: Publish report and samples
        if: always()
        run: |
          mkdir -p /tmp/pub && cp /tmp/out/*.txt /tmp/out/*.log /tmp/out/*.wav /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b mimi-export
          git config user.name vox-ci
          git config user.email vox-ci@users.noreply.github.com
          git add -A
          git commit -qm "Mimi export for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mimi-export
