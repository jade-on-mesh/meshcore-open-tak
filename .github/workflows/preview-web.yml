name: preview web (temporary)
# Temporary: renders MediaMesh Settings to PNGs for a screenshot.
# Lives only on the preview-mediamesh-settings branch; never merged.
on:
  push:
    branches: [preview-mediamesh-settings]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fv
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/preview_mediamesh_settings_test.dart --update-goldens
      # Artifacts can't be fetched from the sandbox; commit the PNGs instead.
      - if: always()
        run: |
          [ -d test/preview ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test/preview
          git commit -m "preview PNGs [skip ci]" && git push origin HEAD:preview-mediamesh-settings
