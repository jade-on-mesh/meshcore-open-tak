name: Smooth motion model

# Builds the model behind the video player's Smooth motion switch
# (lib/vox/vox_interp.dart) and publishes it as the `interp-onnx-v1` release,
# where the app downloads it from.
#
# RIFE 4.9 (Practical-RIFE, MIT, Copyright (c) 2021 hzwer), the official
# weights as mirrored on ComfyUI-Frame-Interpolation's `models` release,
# converted to ONNX by scripts/models/rife_to_onnx.py (PyTorch, weights loaded
# as tensors only). PyTorch and onnx are pinned so the export is the same
# file every time; the download and the result are checked against pinned
# SHA-256s, and the result's must equal VoxInterpModel.sha256Hex.
#
# On a branch that changes this file or the script: builds and checks only.
# Once merged: run it by hand (Actions > Smooth motion model > Run workflow)
# to publish. Publishing again replaces the asset with the identical file.

on:
  push:
    paths:
      - .github/workflows/interp-model.yml
      - scripts/models/rife_to_onnx.py
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (otherwise only build and check)
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: interp-onnx-v1
  PTH_URL: https://github.com/Fannovel16/ComfyUI-Frame-Interpolation/releases/download/models/rife49.pth
  PTH_SHA256: e55fd00f3cc184e3c65961f4bb827a9da022e78eed36b055242c0ac30000d533
  ONNX_SHA256: 5c5db0d4c18459fcbeb41cf48a336e579ddeda31cc622c6dc54bc5f4aaa3ae5b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          set -euo pipefail
          pip install torch==2.15.0 onnx==1.23.2 onnxruntime==1.29.0 numpy
          mkdir -p out
          curl -sSfL --retry 3 -o rife49.pth "$PTH_URL"
          echo "$PTH_SHA256  rife49.pth" | sha256sum -c
          python3 scripts/models/rife_to_onnx.py rife49.pth out/rife49.onnx
          sha256sum out/rife49.onnx
          echo "$ONNX_SHA256  out/rife49.onnx" | sha256sum -c
          grep -q "$ONNX_SHA256" lib/vox/vox_interp.dart || { echo "::error::lib/vox/vox_interp.dart expects another SHA-256"; exit 1; }
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: rife49-onnx
          path: out/rife49.onnx
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Model for the video player's Smooth motion switch (lib/vox/vox_interp.dart). Not an app release.

          rife49.onnx: RIFE 4.9 (IFNet), Practical-RIFE, MIT, Copyright (c) 2021 hzwer, https://github.com/hzwer/Practical-RIFE. Converted from the official 4.9 weights by scripts/models/rife_to_onnx.py. Inputs "img0", "img1" float32 [1,3,H,W] RGB 0..1 (H, W multiples of 64) and "timestep" [1,1,1,1]; output "frame" [1,3,H,W].

          SHA-256: $ONNX_SHA256
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/rife49.onnx --clobber
          else
            gh release create "$TAG" out/rife49.onnx --target "$GITHUB_SHA" \
              --title "Smooth motion model (RIFE 4.9 ONNX)" --notes-file notes.md \
              --prerelease --latest=false
          fi
