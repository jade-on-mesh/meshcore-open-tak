name: VOX codec samples

# One-off listening test: Mimi and LPCNet on the Codec2 test voices.
# Manual only. Results are pushed to the `codec-samples` branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps (CPU-only PyTorch)
        timeout-minutes: 10
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install "transformers>=4.45" soundfile numpy
      - name: Build LPCNet (xiph) with its pretrained model
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          exec > >(tee /tmp/out/lpcnet-build.log) 2>&1
          set -x
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y autoconf automake libtool wget
          git clone https://github.com/xiph/LPCNet.git /tmp/lpcnet
          cd /tmp/lpcnet
          ./autogen.sh
          CFLAGS='-Ofast -g -march=native' ./configure
          make -j"$(nproc)"
      - name: Encode samples
        timeout-minutes: 10
        run: |
          mkdir -p /tmp/out
          python tool/vox/codec_compare.py /tmp/out /tmp/lpcnet/lpcnet_demo 2>&1 | tee /tmp/out/encode.log
          exit ${PIPESTATUS[0]}
      - name: Publish to codec-samples branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cd /tmp/out
          git init -q -b codec-samples
          git config user.name vox-ci
          git config user.email vox-ci@users.noreply.github.com
          git add -A
          git commit -qm "Codec samples for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" codec-samples
