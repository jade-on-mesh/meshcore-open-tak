name: Format

# Applies `dart format` and commits the result to the branch, for sessions
# without a local Flutter SDK: push a commit whose message contains [format]
# (or run it by hand once this file is on the default branch).
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[format]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fv   # the Flutter version: pinned in .flutter-version, bumped by the weekly dependency PR
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: "stable"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format and commit
        run: |
          dart format lib test
          if git diff --quiet; then echo "Already formatted"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "dart format"
          git push
