name: Build

on:
  push:
    branches:
      - main
    # Docs, tooling and the one-off codec workflow don't affect the app.
    paths-ignore:
      - "docs/**"
      - "tool/**"
      - "**/*.md"
      - ".github/workflows/vox-codec-samples.yml"
      - ".github/workflows/vox-mimi-export.yml"
      - ".github/workflows/vox-mimi-release.yml"
      - ".github/workflows/vox-image-compare.yml"
      - ".github/workflows/vox-fetch-compressai.yml"
      - ".github/workflows/vox-fetch-aom.yml"
      - ".github/workflows/aeic-ncnn-models.yml"
      - ".github/workflows/aeic-hd-native.yml"
  workflow_dispatch:

# MeshCore Open TAK builds Android, Windows, macOS and Linux; the publish job
# puts whatever built onto the "Latest build" release. A newer push cancels an
# older, still-running build so minutes aren't spent on superseded commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20 # recent commits for the release notes
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache libaom (Android)
        id: aomcache
        uses: actions/cache@v4
        with:
          path: third_party/aom-android
          key: aom-android-v3.12.1-arm64-1
      - name: Build libaom for Android
        if: steps.aomcache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/aom.tgz "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/deps-cache/aom-v3.12.1.tar.gz"
          echo "76558ad5918820d66fa78460d9957e5bbf7cf9eef1a5421b5ba5e616f200d76e  /tmp/aom.tgz" | sha256sum -c
          tar xzf /tmp/aom.tgz -C /tmp
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          echo "Using NDK: $NDK"
          cmake -S /tmp/aom -B /tmp/aom-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTS=0 -DENABLE_TESTDATA=0 \
            -DENABLE_TOOLS=0 -DCONFIG_AV1_HIGHBITDEPTH=0 -DCONFIG_WEBM_IO=0
          cmake --build /tmp/aom-build -j"$(nproc)" --target aom
          OUT=third_party/aom-android/arm64-v8a
          mkdir -p "$OUT/lib" "$OUT/include/aom"
          cp /tmp/aom-build/libaom.a "$OUT/lib/"
          cp /tmp/aom/aom/*.h "$OUT/include/aom/"
          ls -la "$OUT/lib"
      # AEIC HD photos: mikecarper/AEIC's ncnn codec program, shipped in
      # jniLibs (tool/build_aeic_hd_android.sh explains why it is a .so).
      - name: Cache AEIC HD codec (Android)
        id: aeichdcache
        uses: actions/cache@v4
        with:
          path: third_party/aeic-hd-android
          key: aeic-hd-android-${{ hashFiles('tool/build_aeic_hd_android.sh') }}
      - name: Build AEIC HD codec for Android
        if: steps.aeichdcache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # `yes` fails with a broken pipe when sdkmanager exits without reading
          # all of it (the runner already has this NDK), and pipefail would turn
          # that into a failed step. Only sdkmanager's own status counts.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
          bash tool/build_aeic_hd_android.sh "$ANDROID_HOME/ndk/29.0.14206865" third_party/aeic-hd-android/arm64-v8a
      - name: Add AEIC HD codec to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp third_party/aeic-hd-android/arm64-v8a/libaeic_codec_exec.so android/app/src/main/jniLibs/arm64-v8a/
      - run: flutter pub get
      - name: Release signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-meshcore-open-tak}" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Signing with the permanent release key"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key and will not install over an earlier build"
          fi
      # The version follows MeshCore Open's (pubspec.yaml, kept current by the
      # upstream sync) with -tak added: 9.5.0 upstream -> 9.5.0-tak here. The
      # build number always increases, so every APK installs as an update.
      - name: Build the APK
        run: |
          set -euo pipefail
          upstream=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          echo "Version ${upstream}-tak, build $((1000 + GITHUB_RUN_NUMBER))"
          flutter build apk --release --no-pub --target-platform android-arm64 \
            --build-name="${upstream}-tak" --build-number=$((1000 + GITHUB_RUN_NUMBER)) \
            --dart-define=APP_VERSION="${upstream}-tak" --dart-define=APP_BUILD=$((1000 + GITHUB_RUN_NUMBER))
      - name: Check VOX native libraries and models are in the APK
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk > /tmp/apk.txt
          for f in lib/arm64-v8a/libvox_av1.so lib/arm64-v8a/libcodec2.so \
                   lib/arm64-v8a/libaeic_codec_exec.so \
                   assets/flutter_assets/assets/vox/face_yunet_2023mar.onnx \
                   assets/flutter_assets/assets/vox/text_ppocrv3_det.onnx; do
            grep -q "$f" /tmp/apk.txt || { echo "missing from APK: $f"; exit 1; }
          done
          grep -E "libvox_av1|libcodec2|libaeic_codec_exec|assets/vox" /tmp/apk.txt
          ls -la build/app/outputs/flutter-apk/app-release.apk
          echo "Largest entries:"
          sort -k1 -n -r /tmp/apk.txt | head -15
      - name: Publish APK contents report
        if: always()
        run: |
          mkdir -p /tmp/apkrep && cd /tmp/apkrep
          ls -la "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/" > apk-size.txt 2>&1 || true
          unzip -lv "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk" > apk-contents.txt 2>&1 || true
          sort -k1 -n -r apk-contents.txt | head -40 > apk-largest.txt || true
          echo "${GITHUB_SHA}" > commit.txt
          git init -q -b apk-report
          git config user.name tak-ci
          git config user.email tak-ci@users.noreply.github.com
          git add -A
          git commit -qm "APK report for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-report
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-tak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Desktop builds. Version x.y.z (numeric, as Windows and macOS want it) plus
  # APP_VERSION / APP_BUILD for the app's own display and update check.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      # Codec2 uses C99 variable-length arrays, which MSVC lacks, so it is
      # built with MinGW and loaded next to the exe (lib/services/codec2_ffi.dart).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Build libcodec2.dll
        shell: msys2 {0}
        run: |
          set -euo pipefail
          src=third_party/codec2/src
          files=""
          for f in dump lpc nlp postfilter sine codec2 codec2_fft kiss_fft kiss_fftr interp lsp mbest \
                   newamp1 phase quantise pack codebook codebookd codebookjmv codebookge \
                   codebooknewamp1 codebooknewamp1_energy codebooknewamp2 codebooknewamp2_energy; do
            files="$files $src/$f.c"
          done
          gcc -O2 -std=gnu11 -shared -DGIT_HASH='"Unknown"' -I$src -Ithird_party/codec2/include \
            $files -o libcodec2.dll -static-libgcc -Wl,--export-all-symbols -lm
          ls -la libcodec2.dll
      - run: flutter pub get
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          upstream=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          build=$((1000 + GITHUB_RUN_NUMBER))
          flutter build windows --release --no-pub --build-name="$upstream" --build-number=$build \
            --dart-define=APP_VERSION="${upstream}-tak" --dart-define=APP_BUILD=$build
          cp libcodec2.dll build/windows/x64/runner/Release/
          echo "VERSION=${upstream}-tak" >> "$GITHUB_ENV"
          echo "NUMERIC_VERSION=$upstream" >> "$GITHUB_ENV"
          echo "BUILD=$build" >> "$GITHUB_ENV"
      - name: Package (zip and installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/meshcore-open-tak-windows-x64.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:NUMERIC_VERSION.$env:BUILD" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" windows\installer.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*
          retention-days: 30

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          set -euo pipefail
          upstream=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          build=$((1000 + GITHUB_RUN_NUMBER))
          flutter build macos --release --no-pub --build-name="$upstream" --build-number=$build \
            --dart-define=APP_VERSION="${upstream}-tak" --dart-define=APP_BUILD=$build
      # Unsigned (ad-hoc): the first open needs right-click -> Open. A .dmg
      # with an Applications link, so it installs by dragging.
      - name: Package (dmg)
        run: |
          set -euo pipefail
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          stage=$(mktemp -d)
          cp -R "$app" "$stage/MeshCore Open TAK.app"
          ln -s /Applications "$stage/Applications"
          codesign -dv "$stage/MeshCore Open TAK.app" 2>&1 | head -5 || true
          lipo -info "$stage/MeshCore Open TAK.app/Contents/MacOS/"* || true
          mkdir -p dist
          hdiutil create -volname "MeshCore Open TAK" -srcfolder "$stage" -ov -format UDZO dist/meshcore-open-tak-macos.dmg
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/*
          retention-days: 30

  linux:
    # 22.04 so the AppImage runs on older distributions too (glibc 2.35).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Desktop build dependencies
        run: |
          # A broken third-party source on the runner must not stop the build.
          sudo apt-get update -q 2>&1 | tail -5 || true
          pkgs="clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev libudev-dev libfuse2 file"
          if ! sudo apt-get install -y -q $pkgs > /tmp/apt.log 2>&1; then
            grep -E "^E:|Unable|has no installation candidate" /tmp/apt.log | head -10 | while IFS= read -r l; do echo "::error::apt: $l"; done
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          set -euo pipefail
          upstream=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          build=$((1000 + GITHUB_RUN_NUMBER))
          flutter build linux --release --no-pub --build-name="$upstream" --build-number=$build \
            --dart-define=APP_VERSION="${upstream}-tak" --dart-define=APP_BUILD=$build
          src=third_party/codec2/src
          files=""
          for f in dump lpc nlp postfilter sine codec2 codec2_fft kiss_fft kiss_fftr interp lsp mbest \
                   newamp1 phase quantise pack codebook codebookd codebookjmv codebookge \
                   codebooknewamp1 codebooknewamp1_energy codebooknewamp2 codebooknewamp2_energy; do
            files="$files $src/$f.c"
          done
          gcc -O2 -std=gnu11 -shared -fPIC -DGIT_HASH='"Unknown"' -I$src -Ithird_party/codec2/include \
            $files -o build/linux/x64/release/bundle/lib/libcodec2.so -lm
      - name: Package (tar.gz and AppImage)
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          mkdir -p dist
          tar -czf dist/meshcore-open-tak-linux-x86_64.tar.gz -C "$bundle" --transform 's,^\.,meshcore-open-tak,' .
          appdir=$(mktemp -d)/MeshCoreOpenTAK.AppDir
          mkdir -p "$appdir"
          cp -R "$bundle"/. "$appdir/"
          cp web/icons/Icon-512.png "$appdir/meshcore-open-tak.png"
          cat > "$appdir/meshcore-open-tak.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=MeshCore Open TAK
          Comment=MeshCore mesh radio messaging, voice, photos and team maps
          Exec=meshcore_open
          Icon=meshcore-open-tak
          Categories=Network;Chat;
          Terminal=false
          DESKTOP
          sed -i 's/^ *//' "$appdir/meshcore-open-tak.desktop"
          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/meshcore_open" "$@"
          APPRUN
          sed -i 's/^ *//' "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage \
            || curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --no-appstream "$appdir" dist/meshcore-open-tak-linux-x86_64.AppImage
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*
          retention-days: 30

  # Puts whatever built onto the "Latest build" release, with version.json for
  # the app's update check (AppUpdateService). Android must have built; a
  # failed desktop build is left out rather than holding the release back.
  publish:
    if: always() && github.ref == 'refs/heads/main' && needs.android.result == 'success'
    needs: [android, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20 # recent commits for the release notes
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          set -e
          mkdir -p dist
          cp artifacts/meshcore-open-tak-apk/app-release.apk dist/meshcore-open-tak.apk
          for d in artifacts/desktop-*; do [ -d "$d" ] && cp "$d"/* dist/; done
          ls -la dist
          build=$((1000 + GITHUB_RUN_NUMBER))
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)-tak"
          signed="debug key (uninstall the old app before installing)"
          [ "$SIGNED" = "true" ] && signed="permanent release key (installs over the previous build)"
          have() { [ -f "dist/$1" ]; }
          {
            echo "**MeshCore Open TAK $version** (build $build) · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo
            echo "Follows MeshCore Open ${version%-tak} with the TAK fork's features added."
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| Android (arm64) | **meshcore-open-tak.apk**, signed with the $signed |"
            have meshcore-open-tak-windows-setup.exe && echo "| Windows (x64) | **meshcore-open-tak-windows-setup.exe** (installer), or the .zip to run without installing |"
            have meshcore-open-tak-macos.dmg && echo "| macOS 14+ | **meshcore-open-tak-macos.dmg**: drag to Applications |"
            have meshcore-open-tak-linux-x86_64.AppImage && echo "| Linux (x86_64) | **meshcore-open-tak-linux-x86_64.AppImage** (chmod +x and run), or the .tar.gz |"
            echo
            echo "The desktop builds are unsigned: on Windows choose *More info → Run anyway*; on macOS right-click the app → *Open* the first time."
            echo "Once installed, the app offers later builds itself (Settings → App updates)."
            echo
            echo "Recent changes:"
            git log -8 --no-merges --pretty='- %s' 2>/dev/null || true
          } > notes.md
          # version.json: what the app's update check reads (AppUpdateService).
          BUILD="$build" VERSION="$version" python3 - <<'PY'
          import hashlib, json, os, subprocess
          def asset(name):
              path = os.path.join("dist", name)
              if not os.path.exists(path):
                  return None
              data = open(path, "rb").read()
              return {"name": name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          apk = asset("meshcore-open-tak.apk")
          assets = {k: a for k, a in {
              "android": apk,
              "windows": asset("meshcore-open-tak-windows-setup.exe"),
              "macos": asset("meshcore-open-tak-macos.dmg"),
              "linux": asset("meshcore-open-tak-linux-x86_64.AppImage"),
          }.items() if a}
          log = subprocess.run(["git", "log", "-8", "--no-merges", "--pretty=%s"],
                               capture_output=True, text=True).stdout.splitlines()
          json.dump({
              "version": os.environ["VERSION"],
              "build": int(os.environ["BUILD"]),
              # Top-level fields describe the APK (app builds before desktop support read these).
              "sha256": apk["sha256"],
              "size": apk["size"],
              "commit": os.environ["GITHUB_SHA"][:7],
              "signed": os.environ.get("SIGNED") == "true",
              "changes": [l for l in log if l.strip()],
              "assets": assets,
          }, open("dist/version.json", "w"), indent=2)
          PY
          cat dist/version.json
          # Move the tag to this commit, then create or update the release.
          git tag -f latest-build "$GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/latest-build
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "MeshCore Open TAK $version (build $build)" --notes-file notes.md --latest
          else
            gh release create latest-build --title "MeshCore Open TAK $version (build $build)" --notes-file notes.md --latest
          fi
          # Desktop files of an older build that failed this time are removed, so
          # nothing on the release is older than its title says.
          for old in meshcore-open-tak-windows-setup.exe meshcore-open-tak-windows-x64.zip \
                     meshcore-open-tak-macos.dmg meshcore-open-tak-linux-x86_64.AppImage \
                     meshcore-open-tak-linux-x86_64.tar.gz; do
            [ -f "dist/$old" ] || gh release delete-asset latest-build "$old" -y 2>/dev/null || true
          done
          gh release upload latest-build dist/* --clobber
