name: ATAK plugin

# Checks the MeshCore ATAK plugin's protocol core and the app-side bridge.
# The plugin APK itself needs the ATAK-CIV SDK from tak.gov, which can't be
# committed here, so it is built locally (see atak-plugin/README.md).

on:
  push:
    branches:
      - atak-plugin
    paths:
      - "atak-plugin/**"
      - "lib/team/**"
      - "lib/main.dart"
      - "test/team/**"
      - "android/app/src/main/**"
      - ".github/workflows/atak-plugin.yml"
  workflow_dispatch:

concurrency:
  group: atak-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-core:
    name: Plugin protocol core (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and test the pure-Java core
        run: |
          set -euo pipefail
          mkdir -p /tmp/lib /tmp/out
          curl -sSLo /tmp/lib/junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSLo /tmp/lib/hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          CP=/tmp/lib/junit.jar:/tmp/lib/hamcrest.jar
          SRC=atak-plugin/app/src
          javac -source 8 -target 8 -nowarn -d /tmp/out -cp $CP \
            $(find $SRC/main/java -path '*/core/*.java') $(find $SRC/test/java -name '*.java')
          TESTS=$(cd $SRC/test/java && find . -name '*Test.java' | sed 's|^\./||;s|\.java$||;s|/|.|g')
          java -cp /tmp/out:$CP org.junit.runner.JUnitCore $TESTS

  app:
    name: App analyze + team tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format (writes a patch artifact if anything changes)
        run: |
          dart format lib/team lib/main.dart test/team || true
          git diff > /tmp/format.patch || true
          if [ -s /tmp/format.patch ]; then echo "::warning::dart format would change files"; cat /tmp/format.patch | head -200; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format-patch
          path: /tmp/format.patch
          if-no-files-found: ignore
      - name: Analyze
        run: |
          git checkout -- . # analyze what is committed, not the reformatted tree
          flutter analyze --fatal-infos --fatal-warnings
      - name: Team tests
        run: flutter test test/team

  app-android:
    name: App Android compile (Kotlin bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (no libaom; photo codec skipped)
        run: flutter build apk --debug --target-platform android-arm64
