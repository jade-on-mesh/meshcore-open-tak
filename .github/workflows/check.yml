name: Check

# Fast compile check for work branches: analyzer errors and unit tests,
# without the full APK build.
on:
  push:
    branches-ignore:
      - main
      - apk-report
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail, warnings are listed)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test --reporter=compact
