name: Build

on:
  push:
    branches:
      - main
    # Docs, tooling and the one-off codec workflow don't affect the app.
    paths-ignore:
      - "docs/**"
      - "tool/**"
      - "**/*.md"
      - ".github/workflows/vox-codec-samples.yml"
  workflow_dispatch:

# MeshCore Open VOX builds Android only. A newer push cancels an older,
# still-running build so minutes aren't spent on superseded commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-vox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
