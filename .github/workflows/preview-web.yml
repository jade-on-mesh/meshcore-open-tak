name: preview web (temporary)
# Temporary: renders MediaMesh Settings to PNGs for a screenshot.
# Lives only on the preview-mediamesh-settings branch; never merged.
on:
  push:
    branches: [preview-mediamesh-settings]
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fv
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/preview_mediamesh_settings_test.dart --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: test/preview
          retention-days: 2
