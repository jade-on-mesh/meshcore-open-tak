name: Diag AEIC (temporary)
on:
  push:
    branches: [ci-diag-aeic]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Environment
        if: always()
        run: |
          {
            echo "JAVA_HOME=$JAVA_HOME"; java -version 2>&1 | head -1
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/ndk" 2>&1 | tr '\n' ' '; echo
            ls "$ANDROID_HOME/cmdline-tools" 2>&1 | tr '\n' ' '; echo
            grep -h Pkg.Revision "$ANDROID_HOME/cmdline-tools/latest/source.properties" 2>&1
            which cmake ninja git; cmake --version | head -1
          } 2>&1 | while IFS= read -r l; do echo "::warning title=env::$l"; done
      - name: Fixed line, under build.yml's set -euo pipefail
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
          test -f "$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake"
          echo "::warning title=fixed::sdkmanager line passed"
      - name: A real sdkmanager failure must still fail the step
        run: |
          set -euo pipefail
          if (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;0.0.0-nonexistent" >/dev/null 2>&1; then
            echo "::error title=fixed::a bad package did NOT fail the pipeline"; exit 1
          fi
          echo "::warning title=fixed::a bad package still fails the pipeline"
