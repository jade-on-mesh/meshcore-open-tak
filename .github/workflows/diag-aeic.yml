name: Diag AEIC (temporary)
on:
  push:
    branches: [ci-diag-aeic]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Environment
        if: always()
        run: |
          {
            echo "JAVA_HOME=$JAVA_HOME"; java -version 2>&1 | head -1
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/ndk" 2>&1 | tr '\n' ' '; echo
            ls "$ANDROID_HOME/cmdline-tools" 2>&1 | tr '\n' ' '; echo
            grep -h Pkg.Revision "$ANDROID_HOME/cmdline-tools/latest/source.properties" 2>&1
            which cmake ninja git; cmake --version | head -1
          } 2>&1 | while IFS= read -r l; do echo "::warning title=env::$l"; done
      - name: sdkmanager, as build.yml runs it
        if: always()
        run: |
          set -uo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /tmp/sdk.log 2>&1
          echo "::warning title=sdkmanager::pipeline exit ${PIPESTATUS[*]}"
          tail -25 /tmp/sdk.log | while IFS= read -r l; do echo "::warning title=sdkmanager log::$l"; done
          ls "$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" 2>&1 | while IFS= read -r l; do echo "::warning title=toolchain::$l"; done
      - name: The build script
        if: always()
        run: |
          set -uo pipefail
          bash -x tool/build_aeic_hd_android.sh "$ANDROID_HOME/ndk/29.0.14206865" /tmp/out > /tmp/b.log 2>&1
          echo "::warning title=script::exit $?"
          tail -40 /tmp/b.log | while IFS= read -r l; do echo "::warning title=script log::$l"; done
